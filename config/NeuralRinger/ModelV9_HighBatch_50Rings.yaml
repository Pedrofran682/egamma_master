config_name: "ModelV9_HighBatch_50Rings"
batch_size: 512
epochs: 1000
n_initializations: 3
pred_target_limiar: 0.5
num_workers: 4
debug: false
balance_data: False


et_range_idx: [0,1,2,3,4]
eta_range_idx: [1]

loss_function:
  module: "torch.nn"
  object_name: "BCELoss"

optimizer_function:
  module: "torch.optim"
  object_name: "AdamW"
  parameters:
    lr: 0.010

kFold:
  module: "sklearn.model_selection"
  object_name: "StratifiedKFold"
  parameters:
    n_splits: 10
    random_state: 42
    shuffle: True

model:
  module: "src.Models.egamma.ModelV9"
  object_name: "ModelV9"
  parameters:
    input_dim: 50

dataset:
  module: "src.core.Datasets.EgammaNpzDataset"
  object_name: "EgammaNpzDataset"
  parameters:
    drive_path: "/eos/user/p/pmourafr/egamma_master/data/consolidated/"
    startswith: "consolidated.et"
    endswith: ".npz"
    percentage: 0.5
